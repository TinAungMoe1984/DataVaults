name: Build DataVault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          echo "Files in repository:"
          ls -lah
          echo
          echo "ZIP contents:"
          unzip -l DataVault_GitHub_OneClick.zip | head -100

      - name: Extract DataVault project
        run: |
          rm -rf project
          mkdir project
          unzip -q DataVault_GitHub_OneClick.zip -d project

      - name: Find Android project
        run: |
          echo "Looking for Gradle wrapper..."
          find project -type f -name gradlew -print

          echo
          echo "Project files:"
          find project -maxdepth 4 -type f | head -100

      - name: Build DataVault
        run: |
          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was NOT found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper: $GRADLEW"
          echo "Project directory: $PROJECT_DIR"

          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace
